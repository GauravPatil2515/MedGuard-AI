version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: medguard-postgres
    restart: always
    environment:
      POSTGRES_DB: medguard_db
      POSTGRES_USER: medguard_admin
      POSTGRES_PASSWORD: medguard_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medguard_admin -d medguard_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medguard-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medguard-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://medguard_admin:medguard_secure_password_2026@postgres:5432/medguard_db
      - REDIS_URL=redis://redis:6379/0
      - MEDGUARD_JWT_SECRET=production_jwt_secret_enigma_2026
      - PHARMAGUARD_AUDIT_SECRET=anudrishti_21cfr11_tamper_evident_key_2026_secure
      - PORT=5000
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medguard-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
  redisdata:
